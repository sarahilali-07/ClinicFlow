<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title description">
  <title id="title">ClinicFlow entity relationship diagram</title>
  <desc id="description">Users and patients each have zero to many appointments. Every appointment references exactly one user and one patient.</desc>
  <defs>
    <marker id="one" markerWidth="12" markerHeight="18" refX="6" refY="9" orient="auto">
      <path d="M6 2V16 M10 2V16" fill="none" stroke="#475569" stroke-width="2"/>
    </marker>
    <marker id="many" markerWidth="16" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M14 9H2 M14 9L3 2 M14 9L3 16" fill="none" stroke="#475569" stroke-width="2"/>
      <circle cx="2" cy="9" r="2" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .entity { stroke-width: 2; rx: 12; }
      .heading { font-size: 19px; font-weight: 700; }
      .field { font-size: 14px; }
      .relation { stroke: #475569; stroke-width: 2; fill: none; }
      .cardinality { font-size: 13px; font-weight: 700; fill: #334155; }
      .note { font-size: 13px; fill: #334155; }
    </style>
  </defs>
  <rect width="1100" height="730" fill="#fff"/>

  <path class="relation" d="M370 205 H475 V313 H640" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="relation" d="M370 515 H475 V447 H640" marker-start="url(#one)" marker-end="url(#many)"/>
  <rect x="398" y="194" width="38" height="23" rx="5" fill="#fff"/>
  <text class="cardinality" x="417" y="211" text-anchor="middle">1</text>
  <rect x="580" y="299" width="48" height="23" rx="5" fill="#fff"/>
  <text class="cardinality" x="604" y="316" text-anchor="middle">0..N</text>
  <rect x="398" y="503" width="38" height="23" rx="5" fill="#fff"/>
  <text class="cardinality" x="417" y="520" text-anchor="middle">1</text>
  <rect x="580" y="435" width="48" height="23" rx="5" fill="#fff"/>
  <text class="cardinality" x="604" y="452" text-anchor="middle">0..N</text>

  <g>
    <rect class="entity" x="60" y="80" width="310" height="250" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="heading" x="82" y="112">USERS</text>
    <path d="M60 126H370" stroke="#bfdbfe"/>
    <text class="field" x="82" y="153"><tspan font-weight="700">PK</tspan>  id : UUID</text>
    <text class="field" x="82" y="178">first_name : VARCHAR</text>
    <text class="field" x="82" y="203">last_name : VARCHAR</text>
    <text class="field" x="82" y="228">email : VARCHAR UNIQUE</text>
    <text class="field" x="82" y="253">password : VARCHAR</text>
    <text class="field" x="82" y="278">role : admin | staff</text>
    <text class="field" x="82" y="303">is_active, created_at, updated_at</text>
  </g>

  <g>
    <rect class="entity" x="60" y="390" width="310" height="250" fill="#f0fdf4" stroke="#22c55e"/>
    <text class="heading" x="82" y="422">PATIENTS</text>
    <path d="M60 436H370" stroke="#bbf7d0"/>
    <text class="field" x="82" y="463"><tspan font-weight="700">PK</tspan>  id : UUID</text>
    <text class="field" x="82" y="488">full_name : VARCHAR</text>
    <text class="field" x="82" y="513"><tspan font-weight="700">UK</tspan>  cin : VARCHAR UNIQUE</text>
    <text class="field" x="82" y="538">phone : VARCHAR</text>
    <text class="field" x="82" y="563">birth_date : DATE</text>
    <text class="field" x="82" y="588">address : TEXT (nullable)</text>
    <text class="field" x="82" y="613">created_at, updated_at, deleted_at</text>
  </g>

  <g>
    <rect class="entity" x="640" y="235" width="400" height="290" fill="#fff7ed" stroke="#f97316"/>
    <text class="heading" x="662" y="267">APPOINTMENTS</text>
    <path d="M640 281H1040" stroke="#fed7aa"/>
    <text class="field" x="662" y="309"><tspan font-weight="700">PK</tspan>  id : UUID</text>
    <text class="field" x="662" y="337"><tspan font-weight="700">FK</tspan>  patient_id → patients.id</text>
    <text class="field" x="662" y="365"><tspan font-weight="700">FK</tspan>  created_by → users.id</text>
    <text class="field" x="662" y="393">appointment_date : TIMESTAMPTZ</text>
    <text class="field" x="662" y="421">status : pending | confirmed | cancelled</text>
    <text class="field" x="662" y="449">reason : TEXT</text>
    <text class="field" x="662" y="477">notes : TEXT (nullable)</text>
    <text class="field" x="662" y="505">created_at, updated_at</text>
  </g>

  <rect x="140" y="670" width="820" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="note" x="550" y="694" text-anchor="middle">Each appointment references exactly 1 patient and 1 creating user; each may have 0..N appointments. Both FKs: ON DELETE RESTRICT.</text>
</svg>
